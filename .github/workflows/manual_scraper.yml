name: Aggiornamento Manuale Dati Camera

# Rimuoviamo la direttiva 'schedule' (cron) e manteniamo solo 'workflow_dispatch'
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Livello di log per il debugging'
        required: false
        default: 'INFO'
        type: choice
        options:
          - INFO
          - DEBUG

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    
    # Previene l'esecuzione simultanea di più workflow che causerebbero conflitti di git push
    concurrency: 
      group: data-scraping
      cancel-in-progress: false

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
        with:
          # Necessario per permettere il push successivo
          fetch-depth: 0 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Ottimizza i tempi di esecuzione cachando le dipendenze

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esecuzione Scraping
        run: python build_data_cache.py
        env:
          LOG_LEVEL: ${{ inputs.logLevel }}

      - name: Commit & Push delle modifiche
        run: |
          git config --local user.name "GitHub Actions Bot"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data_cache.json
          
          # Il commit fallisce (exit code 1) se non ci sono diff. 
          # Gestiamo l'eccezione con || e uno short-circuit coerente.
          if git diff --staged --quiet; then
            echo "Nessuna modifica rilevata in data_cache.json. Skip del commit."
          else
            git commit -m "chore(data): aggiornamento manuale dataset Camera"
            git push origin main
          fi
